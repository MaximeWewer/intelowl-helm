{{- if .Values.plugins.enabled }}
{{- /* Holds the inline `secretValue` entries so they stay out of the
       ConfigMap. Rendered only when at least one entry uses them. */}}
{{- $inline := dict }}
{{- range $index, $config := (.Values.plugins.configs | default list) }}
  {{- if hasKey $config "secretValue" }}
    {{- $_ := set $inline (printf "plugin-secret-%d" $index) (toString $config.secretValue | b64enc) }}
  {{- end }}
{{- end }}
{{- if $inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intelowl.fullname" . }}-plugin-values
  labels:
    {{- include "intelowl.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins
  {{- if include "intelowl.useSyncWaves" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := $inline }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
