{{- if and .Values.playbooks.enabled (or .Values.playbooks.definitions .Values.playbooks.pivots) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intelowl.fullname" . }}-playbooks
  labels:
    {{- include "intelowl.labels" . | nindent 4 }}
    app.kubernetes.io/component: playbooks
  {{- if include "intelowl.useSyncWaves" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  {{- end }}
data:
  playbooks.json: |-
    {{- toJson (.Values.playbooks.definitions | default list) | nindent 4 }}

  pivots.json: |-
    {{- toJson (.Values.playbooks.pivots | default list) | nindent 4 }}

  reconcile.py: |-
    """Reconcile IntelOwl playbooks and custom pivots from declarative files.

    Idempotent: playbooks and pivots are matched on `name`, created when
    missing and updated in place otherwise. Nothing is ever deleted.

    Order: playbooks first (without their pivots), then pivots (which start
    playbooks), then the playbook -> pivot links, so both sides can reference
    each other in a single sync.
    """
    import json
    import os
    import sys

    import django

    os.environ.setdefault("DJANGO_SETTINGS_MODULE", "intel_owl.settings")
    django.setup()

    from django.contrib.auth import get_user_model

    from api_app.analyzers_manager.models import AnalyzerConfig
    from api_app.choices import PythonModuleBasePaths
    from api_app.connectors_manager.models import ConnectorConfig
    from api_app.models import Parameter, PluginConfig, PythonModule
    from api_app.pivots_manager.models import PivotConfig
    from api_app.playbooks_manager.models import PlaybookConfig

    STRICT = os.environ.get("PLAYBOOKS_STRICT", "False") == "True"
    OWNER_NAME = os.environ.get("PLAYBOOKS_OWNER", "").strip()

    # Fields copied verbatim when present in a definition.
    SCALAR_FIELDS = (
        "description",
        "type",
        "tlp",
        "disabled",
        "starting",
        "scan_mode",
        "runtime_configuration",
        "for_organization",
    )
    RELATIONS = (
        ("analyzers", AnalyzerConfig),
        ("connectors", ConnectorConfig),
    )
    # Pivot fields copied verbatim when present in a definition.
    PIVOT_FIELDS = ("description", "disabled", "routing_key", "soft_time_limit")

    problems = []

    def resolve(model, names, playbook_name, relation):
        """Map plugin names to config objects, reporting the unknown ones."""
        found = list(model.objects.filter(name__in=names))
        missing = sorted(set(names) - {obj.name for obj in found})
        if missing:
            problems.append(
                "playbook %r: unknown %s: %s" % (playbook_name, relation, ", ".join(missing))
            )
        return found

    def load(path):
        try:
            with open(path) as handle:
                return json.load(handle)
        except FileNotFoundError:
            return []

    definitions = load("/config/playbooks.json")
    pivot_definitions = load("/config/pivots.json")

    owner = None
    if OWNER_NAME:
        owner = get_user_model().objects.filter(username=OWNER_NAME).first()
        if owner is None:
            print("ERROR: owner user %r does not exist" % OWNER_NAME)
            sys.exit(1)

    created_count = updated_count = 0

    for definition in definitions:
        name = definition["name"]
        fields = {key: definition[key] for key in SCALAR_FIELDS if key in definition}
        fields["owner"] = owner

        playbook, created = PlaybookConfig.objects.update_or_create(
            name=name, defaults=fields
        )

        for relation, model in RELATIONS:
            if relation in definition:
                getattr(playbook, relation).set(
                    resolve(model, definition[relation], name, relation)
                )

        created_count += created
        updated_count += not created
        print("%s playbook %r (%d analyzers)" % (
            "created" if created else "updated", name, playbook.analyzers.count()
        ))

    # --- pivots -------------------------------------------------------------
    pivots_count = 0
    for definition in pivot_definitions:
        name = definition["name"]
        module = PythonModule.objects.filter(
            module=definition["python_module"],
            base_path=PythonModuleBasePaths.Pivot.value,
        ).first()
        if module is None:
            problems.append("pivot %r: unknown python_module %r" % (name, definition["python_module"]))
            continue

        fields = {key: definition[key] for key in PIVOT_FIELDS if key in definition}
        fields["python_module"] = module
        # description is mandatory on the model.
        fields.setdefault("description", "Pivot %s" % name)
        pivot, created = PivotConfig.objects.update_or_create(name=name, defaults=fields)

        pivot.related_analyzer_configs.set(
            resolve(AnalyzerConfig, definition.get("analyzers", []), name, "analyzers")
        )
        pivot.related_connector_configs.set(
            resolve(ConnectorConfig, definition.get("connectors", []), name, "connectors")
        )
        pivot.playbooks_choice.set(
            resolve(PlaybookConfig, definition["playbooks"], name, "playbooks")
        )

        for param_name, value in (definition.get("params") or {}).items():
            parameter = Parameter.objects.filter(name=param_name, python_module=module).first()
            if parameter is None:
                problems.append("pivot %r: unknown parameter %r" % (name, param_name))
                continue
            PluginConfig.objects.update_or_create(
                parameter=parameter,
                owner=None,
                for_organization=False,
                pivot_config=pivot,
                defaults={"value": value},
            )

        pivots_count += 1
        print("%s pivot %r -> %s" % (
            "created" if created else "updated", name, ", ".join(definition["playbooks"])
        ))

    # --- playbook -> pivot links (pivots now exist) -------------------------
    for definition in definitions:
        if "pivots" in definition:
            playbook = PlaybookConfig.objects.get(name=definition["name"])
            playbook.pivots.set(
                resolve(PivotConfig, definition["pivots"], definition["name"], "pivots")
            )

    print("done: %d playbook(s) created, %d updated, %d pivot(s)" % (
        created_count, updated_count, pivots_count
    ))

    if problems:
        print("\n%d warning(s):" % len(problems))
        for problem in problems:
            print("  - %s" % problem)
        if STRICT:
            print("failing because playbooks.strict is true")
            sys.exit(1)
{{- end }}
