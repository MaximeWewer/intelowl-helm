    - Classic_DNS
    - CleanBrowsing_Malicious_Detector
    - CloudFlare_DNS
    - CloudFlare_Malicious_Detector
    - DNS4EU
    - DNS4EU_Malicious_Detector
    - ExpandURL
    - Google_DNS
    - MISP
    - Mullvad_DNS
    - PhishingArmy
