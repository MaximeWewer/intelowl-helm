  - name: CTI_Enrich_IP_Fast
    description: 'Triage rapide IP (flux Wazuh): MISP + YETI + GreyNoise + blocklists. ~6 analyzers.'
    type:
    - generic
    - url
    - domain
    - ip
    - hash
    tlp: AMBER
    analyzers:
    - FireHol_IPList
    - GreyNoiseCommunity
    - MISP
    - Spamhaus_DROP
    - TalosReputation
    - YETI
  - name: CTI_Enrich_URL
    description: Enrich URL via MISP + YETI + free OSINT phishing/reputation.
    type:
    - generic
    - url
    - domain
    - ip
    - hash
    tlp: CLEAR
    analyzers:
